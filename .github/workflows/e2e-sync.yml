name: E2E Sync CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-rust-and-ui:
    name: Run E2E Tests Simultaneously
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Make run_e2e.sh executable
        run: chmod +x run_e2e.sh
        
      - name: Run E2E Synchronization Tests
        run: ./run_e2e.sh
        
      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: |
            rust_test.log
            playwright_test.log
