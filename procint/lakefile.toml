name = "procint"
version = "26.7.7"
defaultTargets = ["ProcInt"]
testDriver = "Tests"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "fabf563a7c95a166b8d7b6efca11c8b4dc9d911f"

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib.git"
rev = "1dbda5335e3fc06c414b84ca885a35d4c6d4ab7c"

[[require]]
name = "mfact"
path = "../mfact"

[[lean_lib]]
name = "ProcInt"

[[lean_lib]]
name = "AxiomAudit"

[[lean_lib]]
name = "Quadrature"
roots = ["ProcInt.Release.Quadrature"]

[[lean_lib]]
name = "Tests"
roots = ["ProcInt.Tests"]

[[lean_lib]]
name = "PostRelease"
roots = ["ProcInt.Release.PostRelease"]

[[lean_lib]]
name = "Playground"
roots = ["ProcInt.Playground"]

# Hand-authored demo executable — audits the compiled Playground.Swarm11
# environment via Environment.constants (not a regex/self-report claim
# file). Not a default target; invoked explicitly via `just swarm11-verify`.
[[lean_exe]]
name = "swarm11Verifier"
root = "ProcInt.Playground.Swarm11Verifier"
