site_name: Math Factory PyLab
site_description: All of the Process Intelligence and ML tooling
site_url: https://seanchatmangpt.github.io/mfact
repo_url: https://github.com/seanchatmangpt/mfact
repo_name: seanchatmangpt/mfact

strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material

nav:
  - Home: index.md

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
