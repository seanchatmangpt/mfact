[package]
name = "mfact-core"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.5"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

[build-dependencies]
cc = "1"

[dev-dependencies]
proptest = "1.5.0"

# SELF-IMPROVEMENT-LOOP FIX: G51 -- lint gate per praxis house style
# (PRAXIS_DOGFOODING_EXPLORATION.md CROSS_REPO_INCONSISTENCY #9): loud-failure
# macros denied outright; silent-panic methods warn (tests carry explicit
# allows per ~/.claude/rules/no-overclaiming-rust.md, which exempts tests).
[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "warn"
expect_used = "warn"
